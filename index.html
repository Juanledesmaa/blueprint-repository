<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint Repository</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<style>
  :root {
    --bg: #1c1c1c;
    --panel: #272727;
    --panel-2: #313131;
    --border: #3d3d3d;
    --text: #e8e2d8;
    --text-dim: #a89f91;
    --accent: #ff9f1c;
    --accent-dim: #c77a14;
    --green: #8bc34a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: #555 var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  a { color: var(--accent); }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: linear-gradient(180deg, #232323 0%, #1e1e1e 100%);
    border-bottom: 2px solid var(--accent-dim);
    padding: 12px 20px 0;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    max-width: 1500px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: .5px;
    white-space: nowrap;
  }
  h1 .gear { color: var(--accent); }
  .searchbox {
    flex: 1;
    min-width: 240px;
    position: relative;
  }
  .searchbox input {
    width: 100%;
    padding: 10px 38px 10px 38px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  .searchbox input:focus { border-color: var(--accent); }
  .searchbox .icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }
  .searchbox .clear {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer; padding: 4px 6px;
    display: none;
  }
  .searchbox .clear:hover { color: var(--text); }
  .count {
    color: var(--text-dim);
    font-size: 13px;
    white-space: nowrap;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toolbar select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 10px 0 12px;
    max-width: 1500px;
    margin: 0 auto;
  }
  .tab {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 13px;
    cursor: pointer;
    transition: all .12s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); border-color: #555; }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1200;
    font-weight: 600;
  }
  .tab .n { opacity: .65; font-size: 11px; margin-left: 4px; }

  /* ---------- Grid ---------- */
  main {
    max-width: 1500px;
    margin: 0 auto;
    padding: 20px;
  }
  .cat-heading {
    grid-column: 1 / -1;
    margin: 10px 0 -6px;
    font-size: 17px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: #5a5a5a; }
  .card .imgwrap {
    background: #141414;
    cursor: zoom-in;
    aspect-ratio: 16 / 10;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .card-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .card-title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .card h3 { margin: 0; font-size: 16px; }
  .cat-chip {
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .desc {
    color: var(--text-dim);
    font-size: 13.5px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .desc.open { display: block; -webkit-line-clamp: unset; }
  .desc p { margin: 0 0 .5em; }
  .desc p:last-child { margin-bottom: 0; }
  .desc a { color: var(--accent); }
  .morebtn {
    background: none; border: none;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    align-self: flex-start;
  }
  .bps {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 6px;
  }
  .bp-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .bp-copy {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: all .12s;
  }
  .bp-copy:hover { border-color: var(--accent); }
  .bp-copy .copyicon { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
  .bp-copy.copied { border-color: var(--green); }
  .bp-copy.copied .copyicon { color: var(--green); }
  .bp-view {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .bp-view:hover { color: var(--text); border-color: #555; }
  .bp-string {
    width: 100%;
    background: #141414;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: #9a9a9a;
    font: 11px/1.4 Consolas, monospace;
    padding: 8px;
    resize: vertical;
    min-height: 54px;
  }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 80px 0;
    font-size: 16px;
  }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 30px 20px 40px;
  }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: zoom-out;
    flex-direction: column;
    gap: 10px;
    padding: 24px;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 95vw;
    max-height: 88vh;
    border-radius: 6px;
    box-shadow: 0 10px 50px rgba(0,0,0,.8);
  }
  .lightbox .cap { color: var(--text); font-size: 15px; }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    header { padding: 10px 12px 0; }
    main { padding: 14px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1><span class="gear">⚙</span> Blueprint Repository</h1>
    <div class="searchbox">
      <span class="icon">🔍</span>
      <input id="search" type="search" placeholder="Search blueprints…  (press / to focus)" autocomplete="off">
      <button class="clear" id="clearBtn" title="Clear">✕</button>
    </div>
    <div class="toolbar">
      <select id="sortSel" title="Sort order">
        <option value="original">Original order</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>
    </div>
    <span class="count" id="count"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No blueprints match your search.</div>
</main>

<footer>
  Personal lookup mirror — all blueprints and images from
  <a href="https://autosaved.org/factorio/blueprints" target="_blank" rel="noopener">autosaved.org</a>.
</footer>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" alt="">
  <div class="cap" id="lightboxCap"></div>
</div>

<script src="data.js"></script>
<script>
(function () {
  const data = BLUEPRINT_DATA.map((d, i) => ({ ...d, _i: i }));
  const cats = [];
  data.forEach(d => { if (!cats.includes(d.category)) cats.push(d.category); });

  const grid = document.getElementById('grid');
  const tabsEl = document.getElementById('tabs');
  const searchEl = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('empty');
  const sortSel = document.getElementById('sortSel');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCap = document.getElementById('lightboxCap');

  let activeCat = 'All';
  let query = '';

  /* ---------- Tabs ---------- */
  function renderTabs() {
    tabsEl.innerHTML = '';
    const mk = (name, n) => {
      const b = document.createElement('button');
      b.className = 'tab' + (name === activeCat ? ' active' : '');
      b.innerHTML = escapeHtml(name) + '<span class="n">' + n + '</span>';
      b.onclick = () => { activeCat = name; renderTabs(); render(); window.scrollTo({ top: 0 }); };
      tabsEl.appendChild(b);
    };
    mk('All', data.length);
    cats.forEach(c => mk(c, data.filter(d => d.category === c).length));
  }

  /* ---------- Filtering ---------- */
  function stripHtml(s) {
    const t = document.createElement('div');
    t.innerHTML = s;
    return t.textContent || '';
  }
  const searchIndex = data.map(d =>
    (d.title + ' ' + d.category + ' ' + stripHtml(d.desc) + ' ' +
     d.blueprints.map(b => b.label).join(' ')).toLowerCase()
  );

  function filtered() {
    let items = data.filter((d, i) => {
      if (activeCat !== 'All' && d.category !== activeCat) return false;
      if (query && !searchIndex[d._i].includes(query)) return false;
      return true;
    });
    const sort = sortSel.value;
    if (sort === 'az') items = items.slice().sort((a, b) => a.title.localeCompare(b.title));
    if (sort === 'za') items = items.slice().sort((a, b) => b.title.localeCompare(a.title));
    return items;
  }

  /* ---------- Rendering ---------- */
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render() {
    const items = filtered();
    countEl.textContent = items.length + ' / ' + data.length + ' blueprints';
    emptyEl.style.display = items.length ? 'none' : '';
    grid.innerHTML = '';
    const frag = document.createDocumentFragment();
    let lastCat = null;

    items.forEach(d => {
      if (activeCat === 'All' && sortSel.value === 'original' && d.category !== lastCat) {
        lastCat = d.category;
        const h = document.createElement('h2');
        h.className = 'cat-heading';
        h.textContent = d.category;
        frag.appendChild(h);
      }

      const card = document.createElement('article');
      card.className = 'card';

      // image
      const iw = document.createElement('div');
      iw.className = 'imgwrap';
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = d.image;
      img.alt = d.title;
      iw.appendChild(img);
      iw.onclick = () => {
        lightboxImg.src = d.image;
        lightboxCap.textContent = d.title;
        lightbox.classList.add('show');
      };
      card.appendChild(iw);

      const body = document.createElement('div');
      body.className = 'card-body';

      const titleRow = document.createElement('div');
      titleRow.className = 'card-title-row';
      titleRow.innerHTML = '<h3>' + escapeHtml(d.title) + '</h3>' +
        '<span class="cat-chip">' + escapeHtml(d.category) + '</span>';
      body.appendChild(titleRow);

      // description (clamped, expandable)
      if (d.desc && stripHtml(d.desc).trim()) {
        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.innerHTML = d.desc;
        body.appendChild(desc);
        const more = document.createElement('button');
        more.className = 'morebtn';
        more.textContent = 'more ▾';
        more.onclick = () => {
          const open = desc.classList.toggle('open');
          more.textContent = open ? 'less ▴' : 'more ▾';
        };
        body.appendChild(more);
        // hide "more" if not clamped (after layout)
        requestAnimationFrame(() => {
          if (desc.scrollHeight <= desc.clientHeight + 2) more.style.display = 'none';
        });
      }

      // blueprint buttons
      const bps = document.createElement('div');
      bps.className = 'bps';
      d.blueprints.forEach(b => {
        const row = document.createElement('div');
        row.className = 'bp-row';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'bp-copy';
        copyBtn.innerHTML = '<span>' + escapeHtml(b.label || 'Blueprint') + '</span>' +
          '<span class="copyicon">⧉ copy</span>';
        copyBtn.onclick = async () => {
          try {
            await navigator.clipboard.writeText(b.string);
          } catch (e) {
            // fallback
            const ta = document.createElement('textarea');
            ta.value = b.string;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          copyBtn.classList.add('copied');
          copyBtn.querySelector('.copyicon').textContent = '✓ copied';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.querySelector('.copyicon').textContent = '⧉ copy';
          }, 1500);
        };
        row.appendChild(copyBtn);

        const viewBtn = document.createElement('button');
        viewBtn.className = 'bp-view';
        viewBtn.textContent = '{ }';
        viewBtn.title = 'Show raw blueprint string';
        let ta = null;
        viewBtn.onclick = () => {
          if (ta) { ta.remove(); ta = null; return; }
          ta = document.createElement('textarea');
          ta.className = 'bp-string';
          ta.readOnly = true;
          ta.value = b.string;
          ta.rows = 3;
          ta.onclick = () => ta.select();
          row.insertAdjacentElement('afterend', ta);
        };
        row.appendChild(viewBtn);

        bps.appendChild(row);
      });
      body.appendChild(bps);

      card.appendChild(body);
      frag.appendChild(card);
    });

    grid.appendChild(frag);
  }

  /* ---------- Events ---------- */
  let debounce;
  searchEl.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      query = searchEl.value.trim().toLowerCase();
      clearBtn.style.display = query ? 'block' : 'none';
      render();
    }, 120);
  });
  clearBtn.onclick = () => {
    searchEl.value = '';
    query = '';
    clearBtn.style.display = 'none';
    render();
    searchEl.focus();
  };
  sortSel.onchange = render;

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchEl) {
      e.preventDefault();
      searchEl.focus();
    }
    if (e.key === 'Escape') {
      lightbox.classList.remove('show');
      if (document.activeElement === searchEl) searchEl.blur();
    }
  });
  lightbox.onclick = () => lightbox.classList.remove('show');

  renderTabs();
  render();
})();
</script>
</body>
</html>
